<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
    font-family: Segoe UI;
    text-align: center;
    margin: 0;
    background: #ffffff;
}

.container {
    padding: 20px;
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.date {
    font-size: 22px;
    margin-bottom: 15px;
}

.row {
    font-size: 16px;
    margin: 5px 0;
}
</style>

</head>

<body>

<div class="container">
    <div class="date">WC: <span id="date"></span></div>
    <div class="row">KW: <strong id="week"></strong></div>
    <div class="row">Day: <strong id="day"></strong></div>
    <div class="row">WD Left: <strong id="working"></strong></div>
</div>

<script>
function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function getWeekCommencing(d) {
    var date = new Date(d);
    var day = date.getDay() || 7;
    if (day !== 1)
        date.setHours(-24 * (day - 1));
    return date;
}

function getDayName(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'long' });
}

function getWorkingDaysRemaining(d) {
    var year = d.getFullYear();
    var month = d.getMonth();

    var current = new Date(d);
    var end = new Date(year, month + 1, 0);

    var count = 0;

    while (current <= end) {
        var day = current.getDay();
        if (day !== 0 && day !== 6) {
            count++;
        }
        current.setDate(current.getDate() + 1);
    }

    return count;
}

var today = new Date();

// Week Commencing date
document.getElementById("date").innerText =
    getWeekCommencing(today).toLocaleDateString('en-GB');

// Week number
document.getElementById("week").innerText =
    getWeekNumber(today);

// Day name
document.getElementById("day").innerText =
    getDayName(today);

// Working days remaining in month
document.getElementById("working").innerText =
    getWorkingDaysRemaining(today);
</script>

</body>
</html>
